name: Native pinned mkosi tools probe

on:
  workflow_dispatch:
    inputs:
      pid_isolation:
        description: Also verify the pinned PID namespace and private procfs
        type: boolean
        default: false
      mapped_ownership:
        description: Verify existing subordinate-ID mapping and private file ownership (requires PID isolation)
        type: boolean
        default: false
      final_confinement:
        description: Verify final capability and syscall restrictions (requires mapped ownership and PID isolation)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-pinned-mkosi-tools-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch fixed public inputs without installing
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p -m 700 build/native-tools
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 473225 \
            https://codeload.github.com/systemd/mkosi/tar.gz/ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b \
            --output build/native-tools/source.tar.gz
          release=https://github.com/Lore-Hex/token-exchange-neocloud-in-a-box/releases/download
          curl --disable --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-time 120 --max-filesize 23847293 \
            "$release/build-input-indexes-20261020/metadata.tar.gz" \
            --output build/native-tools/metadata.tar.gz
          printf '%s  %s\n' 54def86b7b37b3b5178782965e499f0242a98f36bc7828105f112005576663a7 \
            build/native-tools/metadata.tar.gz | sha256sum --check --strict
          /usr/bin/python3.10 -I -S -B scripts/fetch_mkosi_tools.py \
            --metadata-archive "$PWD/build/native-tools/metadata.tar.gz" \
            --output "$PWD/build/native-tools/inputs"
      - name: Test pinned tools in native isolation
        env:
          PID_ISOLATION: ${{ inputs.pid_isolation }}
          MAPPED_OWNERSHIP: ${{ inputs.mapped_ownership }}
          FINAL_CONFINEMENT: ${{ inputs.final_confinement }}
        run: |
          args=()
          if [ "$PID_ISOLATION" = true ]; then args+=(--pid-isolation); fi
          if [ "$MAPPED_OWNERSHIP" = true ]; then args+=(--mapped-ownership); fi
          if [ "$FINAL_CONFINEMENT" = true ]; then args+=(--final-confinement); fi
          /usr/bin/python3.10 -I -S -B host/probe-mkosi-native-tools.py \
            --inputs "$PWD/build/native-tools/inputs" \
            --archive "$PWD/build/native-tools/source.tar.gz" \
            --output "$PWD/build/native-tools/evidence" "${args[@]}"
      - name: Preserve content-free probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: native-mkosi-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-tools/evidence/
          if-no-files-found: error
          retention-days: 7
