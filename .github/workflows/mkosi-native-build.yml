name: Bounded offline mkosi installation

on:
  workflow_call:
    inputs:
      compile_driver:
        type: boolean
        default: false
      install_driver:
        type: boolean
        default: false
      guest_runtime:
        type: boolean
        default: false
      verity_root:
        type: boolean
        default: false
      boot_uki:
        type: boolean
        default: false
      validate_export:
        type: boolean
        default: false
      artifact_slot:
        description: Fixed first or second repeat-build metadata namespace
        type: string
        required: true
  workflow_dispatch:
    inputs:
      compile_driver:
        description: Compile the pinned NVIDIA driver after installation (no loading or boot)
        type: boolean
        default: false
      install_driver:
        description: Install verified driver modules into the private guest root (requires compile_driver; never loads)
        type: boolean
        default: false
      guest_runtime:
        description: Install the reviewed 212-package runtime candidate instead of the kernel-only candidate
        type: boolean
        default: false
      verity_root:
        description: >-
          Generate and verify private EROFS/verity files
          (requires runtime and driver installation; no export or boot)
        type: boolean
        default: false
      boot_uki:
        description: >-
          Assemble and inspect private initrd/unsigned UKI
          (requires verity_root; no export, signing or boot)
        type: boolean
        default: false
      validate_export:
        description: Verify then delete private GPT/UKI; upload JSON only (requires all five build flags; no boot)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bounded-offline-mkosi-installation
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      ARTIFACT_SUFFIX: ${{ inputs.artifact_slot && format('-{0}', inputs.artifact_slot) || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate artifact namespace
        env:
          ARTIFACT_SLOT: ${{ inputs.artifact_slot }}
        run: |
          case "$ARTIFACT_SLOT" in ''|first|second) ;; *) exit 1 ;; esac
      - name: Fetch and authenticate fixed public inputs without installing
        env:
          GUEST_RUNTIME: ${{ inputs.guest_runtime }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p -m 700 build/native-install
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 473225 \
            https://codeload.github.com/systemd/mkosi/tar.gz/ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b \
            --output build/native-install/source.tar.gz
          release=https://github.com/Lore-Hex/token-exchange-neocloud-in-a-box/releases/download
          curl --disable --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-time 120 --max-filesize 23847293 \
            "$release/build-input-indexes-20261020/metadata.tar.gz" \
            --output build/native-install/metadata.tar.gz
          printf '%s  %s\n' 54def86b7b37b3b5178782965e499f0242a98f36bc7828105f112005576663a7 \
            build/native-install/metadata.tar.gz | sha256sum --check --strict
          target=--include-guest
          if [ "$GUEST_RUNTIME" = true ]; then target=--guest-runtime; fi
          /usr/bin/python3.10 -I -S -B scripts/fetch_mkosi_tools.py "$target" \
            --metadata-archive "$PWD/build/native-install/metadata.tar.gz" \
            --output "$PWD/build/native-install/inputs" > build/native-install/input-fetch.log
      - name: Install only in the resource-bounded offline namespace
        id: build
        env:
          COMPILE_DRIVER: ${{ inputs.compile_driver }}
          INSTALL_DRIVER: ${{ inputs.install_driver }}
          GUEST_RUNTIME: ${{ inputs.guest_runtime }}
          VERITY_ROOT: ${{ inputs.verity_root }}
          BOOT_UKI: ${{ inputs.boot_uki }}
          VALIDATE_EXPORT: ${{ inputs.validate_export }}
        run: |
          args=()
          if [ "$GUEST_RUNTIME" = true ]; then args+=(--guest-runtime); fi
          if [ "$COMPILE_DRIVER" = true ]; then args+=(--compile-driver); fi
          if [ "$INSTALL_DRIVER" = true ]; then
            test "$COMPILE_DRIVER" = true
            args+=(--install-driver)
          fi
          if [ "$VERITY_ROOT" = true ]; then
            test "$GUEST_RUNTIME" = true
            test "$INSTALL_DRIVER" = true
            test "$COMPILE_DRIVER" = true
            args+=(--verity-root)
          fi
          if [ "$BOOT_UKI" = true ]; then
            test "$VERITY_ROOT" = true
            args+=(--boot-uki)
          fi
          if [ "$VALIDATE_EXPORT" = true ]; then
            test "$BOOT_UKI" = true
            test "$VERITY_ROOT" = true
            test "$GUEST_RUNTIME" = true
            test "$INSTALL_DRIVER" = true
            test "$COMPILE_DRIVER" = true
            args+=(--export-boot)
          fi
          sudo -- /usr/bin/python3.10 -I -S -B host/run-mkosi-build.py \
            --downloads "$PWD/build/native-install/inputs" \
            --archive "$PWD/build/native-install/source.tar.gz" \
            --output "$PWD/build/native-install/evidence" "${args[@]}"
      - name: Verify and delete private export before preparing metadata
        id: export_validation
        if: ${{ always() && inputs.validate_export }}
        timeout-minutes: 5
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          result="$(/usr/bin/python3.10 -I -S -B host/validate-native-boot-export.py \
            --build-result "$BUILD_RESULT")"
          case "$result" in pass|fail) ;; *) exit 1 ;; esac
          printf 'metadata_ready=true\n' >> "$GITHUB_OUTPUT"
          test "$result" = pass
      - name: Preserve installation and independent cleanup evidence
        if: ${{ always() && !inputs.validate_export }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: native-mkosi-install-${{ github.run_id }}-${{ github.run_attempt }}${{ env.ARTIFACT_SUFFIX }}
          path: |
            build/native-install/input-fetch.log
            build/native-install/evidence/
            build/native-install/evidence-resources.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve only verified export metadata after image deletion
        if: ${{ always() && inputs.validate_export && steps.export_validation.outputs.metadata_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: native-mkosi-export-validation-${{ github.run_id }}-${{ github.run_attempt }}${{ env.ARTIFACT_SUFFIX }}
          path: |
            build/native-install/export-validation/validation.json
            build/native-install/export-validation/manifest.json
            build/native-install/export-validation/run.json
            build/native-install/export-validation/result.json
            build/native-install/export-validation/resources.json
          if-no-files-found: error
          retention-days: 7
