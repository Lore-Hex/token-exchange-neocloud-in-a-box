# Gitleaks v8.30.1 rule extension: preserve all default detection rules.
# https://github.com/gitleaks/gitleaks/blob/v8.30.1/README.md#configuration
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Four original hashes of fixed synthetic token-ID sequences"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-22-(tokenizer-parity-(tool-protocol-fail|fixed-pass|runtime-pass)|provider-conformance-pass)/output\.log$''', '''(^|/)evidence/p2/2026-10-23-stream-(window-exhaustion|600s-complete)/output\.log$''', '''(^|/)evidence/p2/2026-10-24-selected-stream-timeout/output\.log$''']
regexes = ['''^\s*"tokens_sha256": "(9d6bde6f28006680e5d37e06d816356d782004f1e8dbabf46d42e81b088afc16|c7b86dad075d1d51e4bf9aec664d9ce392e5d04a63babe717ab9354ec0b56032|6ddfa5e6dbf2f45b8efc1e2ebda65f1f79c39b1a4ec8a7fce8e77fc5a0add7d5|4e5eb88296779609b1ef81a335894e3ef5c284a94a8ceb1607421414c43c9cbe)"\s*$''']

[[rules.allowlists]]
description = "Exact original source-derived prefix and four fixed control token-ID hashes"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)evidence/p2/2026-10-23-native-prefix-count/result/output\.log$''', '''(^|/)evidence/p2/2026-10-24-selected-prefix-count/result/output\.log$''']
regexes = ['''^tokens_sha256":"(9d6bde6f28006680e5d37e06d816356d782004f1e8dbabf46d42e81b088afc16|c7b86dad075d1d51e4bf9aec664d9ce392e5d04a63babe717ab9354ec0b56032|6ddfa5e6dbf2f45b8efc1e2ebda65f1f79c39b1a4ec8a7fce8e77fc5a0add7d5|4e5eb88296779609b1ef81a335894e3ef5c284a94a8ceb1607421414c43c9cbe|bd6e6807cddbb0f4844b130b9d8e7632f25ebc12a367ffb9ab412d1b23340c09)"$''']

[[rules.allowlists]]
description = "Two exact public tokenizer source hashes in the original input contract"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-22-(tokenizer-parity-runtime-pass|provider-conformance-pass)/input-contract\.json$''']
regexes = ['''^\s*"tokenizer-adapter\.py": "060220d1bc62f13278e5a03a3a85c39ef84f528ada2a9e39ab0c62a4a7c09960",\s*$''', '''^\s*"tokenizer-parity\.py": "09d704cf6d87c23b4115d40d501248a74502b37124cff57da5ad59ac7ff9951a"\s*$''']

[[rules.allowlists]]
description = "Three exact public source hash fields in original stream inputs"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-23-stream-(preparation-failure|window-exhaustion|600s-complete)/input-contract\.json$''']
regexes = ['''^\s*"tokenizer-adapter\.py": "060220d1bc62f13278e5a03a3a85c39ef84f528ada2a9e39ab0c62a4a7c09960",\s*$''', '''^\s*"tokenizer-parity\.py": "09d704cf6d87c23b4115d40d501248a74502b37124cff57da5ad59ac7ff9951a"\s*$''', '''^\s*"stream/engine_tokenizer_parity\.py": "09d704cf6d87c23b4115d40d501248a74502b37124cff57da5ad59ac7ff9951a",\s*$''']

[[rules.allowlists]]
description = "Nine exact synthetic workload token-ID hashes in original stream receipts"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-23-stream-(window-exhaustion|600s-complete)/output\.log$''', '''(^|/)evidence/p2/2026-10-24-selected-stream-timeout/output\.log$''']
regexes = ['''^\s*"token_ids_sha256": "(d061ea411012b683576ee86d57d07054066b842e936edb4e0ff7d89bd97c5470|4d7e4f06506e1e47b470b40a38ec147fef8016cae2675b4fc1d7ee5d941088c7|ff76892724504c2a7ee072064c89c029664b421b491f7232a3a1e264d9653a1d|4c53823667bac7092f3f1aacf02c6a0a5f8d11ba6b855af70267f484b8d7bc83|b750144a2ab856791ad30cd5f8490509ecbbebf7f06bfcd729873becd36248ef|66580e2260a1cb593df35123b62ccd5834a9ba0e2f7aac5901f0ad841b9f3d06|e1fdec586d6a4fcdb513c01c85c3ae9ca4f3841215515bfccfee06d00cab5a02|c2b7a5883e367117f9956115c67ce31de3c8ae610396b9e214ab72faeed28cf2|72cb95039dc41812098f6f9e6d40525acc5fa3c41ab9550fdb12f60ea2b0c713)"\s*$''']

[[rules.allowlists]]
description = "Three exact source hash fields in the original selected-checkpoint stream contract"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-24-selected-stream-timeout/input-contract\.json$''']
regexes = ['''^\s*"tokenizer-adapter\.py": "060220d1bc62f13278e5a03a3a85c39ef84f528ada2a9e39ab0c62a4a7c09960",\s*$''', '''^\s*"tokenizer-parity\.py": "98872d2cb2e0b0874c79ef475c31db5a1d90b9024dc245f7cd0344b7173ed090"\s*$''', '''^\s*"stream/engine_tokenizer_parity\.py": "98872d2cb2e0b0874c79ef475c31db5a1d90b9024dc245f7cd0344b7173ed090",\s*$''']

[[rules.allowlists]]
description = "Exact public probe source hash in the original CPU receipts"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-22-cpu-parity-(readiness|argv|base-inspect)-failure/output\.log$''', '''(^|/)evidence/p2/2026-10-22-cpu-parity-native-pass/output\.log$''', '''(^|/)evidence/p2/2026-10-22-cpu-session-parity-failure/output\.log$''', '''(^|/)evidence/p2/2026-10-22-cpu-session-parity-failure/pair/output\.log$''', '''(^|/)evidence/p2/2026-10-22-cpu-session-native-pass/(pair/)?output\.log$''', '''(^|/)evidence/p2/2026-10-22-tau-cpu-prompt-fit-pass/(pair/)?output\.log$''']
regexes = ['''^\s*"scripts/engine_tokenizer_parity\.py": "09d704cf6d87c23b4115d40d501248a74502b37124cff57da5ad59ac7ff9951a",\s*$''']

[[rules.allowlists]]
description = "Four original Qwen CPU hashes of fixed synthetic token-ID sequences"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-22-cpu-parity-native-pass/output\.log$''', '''(^|/)evidence/p2/2026-10-22-cpu-session-native-pass/pair/output\.log$''', '''(^|/)evidence/p2/2026-10-22-tau-cpu-prompt-fit-pass/pair/output\.log$''']
regexes = ['''^\s*"tokens_sha256": "(1b7419454da94e65624a0661ad74892eb52f65719dca41152acf9a6aa78b3cbd|fbaf9b9465ebf03803f0a8b5a24ca6b38dede64a287439371f87958033074fd4|c7450fed1a18f2dc5a4de67c84383999a8e240336ce4bd132c32e1cbf9b4ee9b|8da30159fe7f3f8c8d893edc5c34df0cfd719620133706bcf6e2c254c3a432fe)"\s*$''']

[[rules.allowlists]]
description = "Exact original held-pair tokenizer receipt byte hashes"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-22-cpu-session-native-pass/(pair/)?output\.log$''']
regexes = ['''^\s*"simulator-tokenizer\.json": "de96abc426d3e94cfbc45736e27641c1498220325c57b08306d8eaa98728300f"\s*$''', '''^\s*"evaluator-tokenizer\.json": "132e5b388cb51278d647d7e1b9627754c5bf4d2537450a749b774314423e430d",\s*$''']

[[rules.allowlists]]
description = "Fixed synthetic token-ID hashes in the two compact original tokenizer receipts"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)evidence/p2/2026-10-22-(cpu-session-native-pass|tau-cpu-prompt-fit-pass)/pair/(simulator|evaluator)-tokenizer\.json$''']
regexes = ['''^(endpoint|independent)_tokens_sha256":"(1b7419454da94e65624a0661ad74892eb52f65719dca41152acf9a6aa78b3cbd|fbaf9b9465ebf03803f0a8b5a24ca6b38dede64a287439371f87958033074fd4|c7450fed1a18f2dc5a4de67c84383999a8e240336ce4bd132c32e1cbf9b4ee9b|8da30159fe7f3f8c8d893edc5c34df0cfd719620133706bcf6e2c254c3a432fe)"$''']

[[rules.allowlists]]
description = "Exact Qwen 0.6B GGUF tokenizer recipe identity in its two compact originals"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)evidence/p2/2026-10-22-(cpu-session-native-pass|tau-cpu-prompt-fit-pass)/pair/simulator-(runtime|tokenizer)\.json$''']
regexes = ['''^tokenizer_sha256":"554324f21418252a59edb045493a143a783b499d67b8680883e310e0f2ee77d9"$''']

[[rules.allowlists]]
description = "Exact Qwen 1.7B GGUF tokenizer recipe identity in its two compact originals"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)evidence/p2/2026-10-22-(cpu-session-native-pass|tau-cpu-prompt-fit-pass)/pair/evaluator-(runtime|tokenizer)\.json$''']
regexes = ['''^tokenizer_sha256":"604363ffa22647728e0dd56e84926ad3ca1422999e356af99628fe2535b010a8"$''']

[[rules.allowlists]]
description = "Exact original CPU prompt-probe tokenizer receipt byte hashes"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)evidence/p2/2026-10-22-tau-cpu-prompt-fit-pass/(pair/)?output\.log$''']
regexes = ['''^\s*"simulator-tokenizer\.json": "a51a69f903338d9651a6853f3f452bcb63bfad0a279eb721c17d6557f20165b4"\s*$''', '''^\s*"evaluator-tokenizer\.json": "dae972a868e9cd829062348c9bc4e51b1fc3d4b51dd18fc122818c2ae2e83b8c",\s*$''']
